name: akshara_app
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Localization and translations
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Supabase integration (replacing Firebase)
  supabase_flutter: ^2.8.0

  # HTTP and speech
  http: ^1.2.1
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  flutter_quiz_matcher: ^0.0.4

  # Hive for local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/

